xq_gz_bridge_node:
  ros__parameters:
    use_sim_time: true
    gz_clock_topic: /clock
    ros_clock_topic: /clock

    gz_lidar_topic: /xq/p4/lidar/points
    ros_lidar_topic: /livox/lidar
    lidar_frame_id: livox_frame
    gz_imu_topic: /xq/p4/imu
    ros_imu_topic: /livox/imu
    imu_frame_id: livox_imu

    # The ArduPilot plugin owns vehicle actuation; this bridge command path is
    # deliberately unused in P4.
    ros_cmd_vel_topic: /xq/p4/unused_cmd_vel
    gz_cmd_vel_topic: /model/xq_p4_uav1/unused_cmd_vel

    # Evaluation-only world pose.  FAST-LIO, the ExternalNav adapter, and the
    # mission node are forbidden from subscribing to this topic.
    publish_ground_truth: true
    gz_ground_truth_topic: /world/xq_p4_external_nav/pose/info
    ground_truth_source_type: pose_v
    ground_truth_entity_name: xq_p4_uav1
    ros_ground_truth_topic: /xq/eval/p4/ground_truth
    world_frame_id: xq_world
    base_frame_id: xq_base_link

    lidar_range_noise_std_m: 0.015
    lidar_dropout_ratio: 0.0
    imu_dropout_ratio: 0.0
    lidar_timestamp_jitter_ms: 0.0
    imu_timestamp_jitter_ms: 0.0
    random_seed: 20260822
    motion_distortion_enabled: false
    lidar_scan_period_s: 0.1
    motion_linear_velocity_mps: [0.0, 0.0, 0.0]
    motion_yaw_rate_rps: 0.0
    lidar_extrinsic_error_xyz_m: [0.0, 0.0, 0.0]
    lidar_extrinsic_error_rpy_rad: [0.0, 0.0, 0.0]
